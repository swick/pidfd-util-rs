[package]
name = "pidfd-util"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["The pidfd-util-rs authors"]
description = "Safe Rust wrapper for Linux process file descriptors (pidfd)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/swick/pidfd-util-rs"
homepage = "https://github.com/swick/pidfd-util-rs"
documentation = "https://docs.rs/pidfd-util"
readme = "README.md"
keywords = ["pidfd", "process", "linux", "pid", "file-descriptor"]
categories = ["os::linux-apis"]

[features]
default = ["async"]
nightly = []
async = ["async-io"]

[dependencies]
libc = { version = "0.2" }
async-io = { version = ">=1,<3", optional = true }
nix = { version = ">=0.30,<0.32", features = [
    "ioctl",
    "fs",
    "sched",
] }
name-to-handle-at = { version = "0.1", git = "https://github.com/swick/name-to-handle-at-rs.git" }

[dev-dependencies]
futures-lite = "2.0"
nix = { version = ">=0.30,<0.32", features = [
    "ioctl",
    "fs",
    "sched",
    "user",
] }
