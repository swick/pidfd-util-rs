[package]
name = "pidfd-util"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[features]
default = ["async"]
nightly = []
async = ["async-io"]

[dependencies]
libc = { version = "0.2" }
async-io = { version = ">=1,<3", optional = true }
nix = { version = ">=0.30,<0.32", features = [
    "ioctl",
    "fs",
    "sched",
] }

[dev-dependencies]
futures-lite = "2.0"
nix = { version = ">=0.30,<0.32", features = [
    "ioctl",
    "fs",
    "sched",
    "user",
] }
